<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Pernikahan Piter & Dia</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5e9da, #e8d5c4);
    font-family: Georgia, serif;
  }
  .wrapper { text-align: center; }
  .envelope {
    width: 280px;
    height: 190px;
    background: #fdf6ec;
    border: 2px solid #c9a876;
    position: relative;
    margin: 0 auto 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    border-radius: 6px;
  }
  .envelope::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-top: 95px solid #e8d5b7;
  }
  h1 {
    color: #6b4f2a;
    font-size: 22px;
    margin-bottom: 20px;
  }
  .btn-buka {
    display: inline-block;
    padding: 14px 36px;
    background: #c9a876;
    color: #fff;
    text-decoration: none;
    border-radius: 30px;
    font-size: 16px;
    letter-spacing: 1px;
    box-shadow: 0 6px 15px rgba(201,168,118,0.5);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .btn-buka:hover {
    background: #b4925f;
    transform: translateY(-3px);
  }
</style>
</head>
<body>
  <audio id="musik-undangan" src="Piter.mp3" loop></audio>

<script>
  var params = new URLSearchParams(window.location.search);
  if (params.get("musik") === "aktif") {
    document.getElementById("musik-undangan").play();
  }
</script>
  <div class="wrapper">
    <h1>Piter & Dia</h1>
    <div class="envelope"></div>
    <a href="UndanganPernikahan.html" class="btn-buka">Buka Undangan</a>
  </div>
</body>
</html>
