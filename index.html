<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan Peter & Ria</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6efe6;
      font-family: Georgia, serif;
      color: #4a3b2a;
      text-align: center;
    }
    .wrapper { padding: 24px; }
    h1 { font-size: 2.2rem; margin-bottom: 8px; }
    .tanggal { margin-bottom: 28px; letter-spacing: 2px; }
    .envelope {
      width: 220px;
      height: 150px;
      margin: 0 auto 32px;
      background: #e8d5b7;
      border: 2px solid #b8935a;
      border-radius: 6px;
      position: relative;
    }
    .envelope::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      border-left: 108px solid transparent;
      border-right: 108px solid transparent;
      border-top: 85px solid #d4b88a;
    }
    .btn-buka {
      display: inline-block;
      padding: 12px 28px;
      background: #b8935a;
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      transition: transform 0.2s;
    }
    .btn-buka:hover { transform: translateY(-3px); }
  </style>
</head>
<body>
  <audio id="musik-undangan" loop>
    <source src="musik.mp3" type="audio/mpeg">
  </audio>

  <div class="wrapper">
    <h1>Peter & Ria</h1>
    <p class="tanggal">23 Maret 2029</p>
    <div class="envelope"></div>
    <a href="UndanganPernikahan.html" class="btn-buka" onclick="putarMusik()">Buka Undangan</a>
  </div>

  <script>
    function putarMusik() {
      document.getElementById("musik-undangan").play();
    }
  </script>
</body>
</html>
